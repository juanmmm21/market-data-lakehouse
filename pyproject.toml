[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-data-lakehouse"
version = "0.1.0"
description = "Streaming pipeline that aggregates ticks into OHLCV candles and persists them in Parquet and DuckDB."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "juanmmm21" }]
dependencies = [
    "duckdb>=1.0,<2",
    "pyarrow>=15.0,<23",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_data_lakehouse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
