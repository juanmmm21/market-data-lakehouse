[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-data-lakehouse"
version = "0.1.0"
description = "Streaming pipeline that aggregates ticks into OHLCV candles and persists them in Parquet and DuckDB."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "juanmmm21" }]
keywords = ["parquet", "duckdb", "ohlcv", "lakehouse", "market-data", "candles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.0,<2",
    "pyarrow>=15.0,<23",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
market-data-lakehouse = "market_data_lakehouse.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data_lakehouse"]

[tool.hatch.build.targets.sdist]
include = ["src/market_data_lakehouse", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
